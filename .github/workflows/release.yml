name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v2.1.0)'
        required: false
        type: string

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: inverter-dashboard-vue

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build SPA
        run: npm run build
        env:
          BUILD_OUTPUT_DIR: build

      - name: Upload SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-spa-dist
          path: dist/
          retention-days: 30

      - name: Build Library
        run: npm run build:lib

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-library-dist
          path: dist-lib/
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            dist/**/*
            dist-lib/**/*

  notify-downstream:
    name: Notify Downstream Repositories
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
   _strategy:
      fail-fast: false
      matrix:
        repo: [inverter-dashboard, inverter-dashboard-go]
        include:
          - repo: inverter-dashboard
            file: Python static files
          - repo: inverter-dashboard-go
            file: Go internal/html/dist

    steps:
      - name: Dispatch workflow in ${{ matrix.repo }}
        uses: actions/dispatch-workflow@v2
        with:
          owner: victron-venus
          repo: ${{ matrix.repo }}
          workflow: 'vue-ui-update.yml'
          workflow_file: '.github/workflows/vue-ui-update.yml'
          inputs: '{"tag": "${{ needs.release.outputs.version }}"}'
        env:
          GITHUB_TOKEN: ${{ secrets.VICTRON_BOT_TOKEN }}

  summary:
    name: Release Summary
    needs: [build, release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Vue Dashboard Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ needs.release.outputs.upload_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **SPA:** `dist/` directory" >> $GITHUB_STEP_SUMMARY
          echo "- **Library:** `dist-lib/` UMD + ES modules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Other repositories can download via:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "gh release download victron-venus/inverter-dashboard-vue@${{ needs.release.outputs.version }} --pattern '*/*'" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY