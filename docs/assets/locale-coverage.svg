<title id="title">Catalog-key parity: 498 keys in each of six locales</title>
<desc id="description">Horizontal bars show English, Russian, Ukrainian, German, French and Dutch each containing all 498 English-baseline keys at source commit 6bcfd8d. All six key sets match. This measures catalog-key parity, not translation quality, visual fit, runtime coverage or completed deployment.</desc>
