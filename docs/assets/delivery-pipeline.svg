<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title description">
<title id="title">From a reviewed source to a verified browser</title>
<desc id="description">A six-stage delivery process, not a completed release report. Reviewed source goes through checks to an official frontend artifact; Python and Go backends adopt those exact files, publish their own images, and roll out to k3s. Verification then checks served bytes and browser behavior. Every stage needs its own evidence.</desc>
<rect width="1280" height="850" rx="24" fill="#f5f8fc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="64" font-size="34" font-weight="700" fill="#17324d" >From source to a verified browser</text><text x="48" y="101" font-size="20" font-weight="400" fill="#425b73" >Six evidence handoffs • the arrows describe the process, not completion</text><rect x="48" y="125" width="1184" height="42" rx="12" fill="#e5edf7"/><text x="66" y="152" font-size="18" font-weight="600" fill="#17324d" >Scope: shared Vue UI → independent Python and Go releases → each deployed dashboard</text><g aria-hidden="true">
<line x1="420" y1="303" x2="442" y2="303" stroke="#58718a" stroke-width="3"/><polygon points="452,303 439,296 439,310" fill="#58718a"/>
<line x1="830" y1="303" x2="852" y2="303" stroke="#58718a" stroke-width="3"/><polygon points="862,303 849,296 849,310" fill="#58718a"/>
<line x1="1050" y1="413" x2="1050" y2="436" stroke="#58718a" stroke-width="3"/><polygon points="1050,446 1043,433 1057,433" fill="#58718a"/>
<line x1="856" y1="555" x2="834" y2="555" stroke="#58718a" stroke-width="3"/><polygon points="824,555 837,548 837,562" fill="#58718a"/>
<line x1="446" y1="555" x2="424" y2="555" stroke="#58718a" stroke-width="3"/><polygon points="414,555 427,548 427,562" fill="#58718a"/>
</g>
<g data-stage="01"><rect x="48" y="198" width="364" height="206" rx="18" fill="#edf8f7" stroke="#cbd8e6"/><rect x="64" y="216" width="44" height="32" rx="9" fill="#167c80"/><text x="86" y="239" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">01</text><text x="120" y="240" font-size="22" font-weight="700" fill="#17324d" >Reviewed source</text><text x="68" y="281" font-size="19" font-weight="400" fill="#17324d" >Review code, docs and catalogs.</text><text x="68" y="308" font-size="19" font-weight="400" fill="#17324d" >Bind the accepted change to</text><text x="68" y="335" font-size="19" font-weight="400" fill="#17324d" >one exact source commit.</text><path d="M 68 352 H 392" stroke="#cbd8e6"/><text x="68" y="379" font-size="16" font-weight="600" fill="#425b73" >EVIDENCE  ·  review + source SHA</text></g>
<g data-stage="02"><rect x="458" y="198" width="364" height="206" rx="18" fill="#edf3fc" stroke="#cbd8e6"/><rect x="474" y="216" width="44" height="32" rx="9" fill="#3469b7"/><text x="496" y="239" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">02</text><text x="530" y="240" font-size="22" font-weight="700" fill="#17324d" >Required checks</text><text x="478" y="281" font-size="19" font-weight="400" fill="#17324d" >Validate the locked inputs,</text><text x="478" y="308" font-size="19" font-weight="400" fill="#17324d" >tests, analysis and declared</text><text x="478" y="335" font-size="19" font-weight="400" fill="#17324d" >release build matrix.</text><path d="M 478 352 H 802" stroke="#cbd8e6"/><text x="478" y="379" font-size="16" font-weight="600" fill="#425b73" >EVIDENCE  ·  checks + build receipts</text></g>
<g data-stage="03"><rect x="868" y="198" width="364" height="206" rx="18" fill="#f2effb" stroke="#cbd8e6"/><rect x="884" y="216" width="44" height="32" rx="9" fill="#7661bc"/><text x="906" y="239" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">03</text><text x="940" y="240" font-size="22" font-weight="700" fill="#17324d" >Official frontend</text><text x="888" y="281" font-size="19" font-weight="400" fill="#17324d" >Publish a unique candidate.</text><text x="888" y="308" font-size="19" font-weight="400" fill="#17324d" >Verify the manifest, source</text><text x="888" y="335" font-size="19" font-weight="400" fill="#17324d" >binding and every payload.</text><path d="M 888 352 H 1212" stroke="#cbd8e6"/><text x="888" y="379" font-size="16" font-weight="600" fill="#425b73" >EVIDENCE  ·  manifest + file hashes</text></g>
<g data-stage="04"><rect x="868" y="452" width="364" height="206" rx="18" fill="#fff6eb" stroke="#cbd8e6"/><rect x="884" y="470" width="44" height="32" rx="9" fill="#995b13"/><text x="906" y="493" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">04</text><text x="940" y="494" font-size="22" font-weight="700" fill="#17324d" >Backend adoption</text><text x="888" y="535" font-size="19" font-weight="400" fill="#17324d" >Embed the verified SPA bytes</text><text x="888" y="562" font-size="19" font-weight="400" fill="#17324d" >in both backends; validate and</text><text x="888" y="589" font-size="19" font-weight="400" fill="#17324d" >publish each backend image.</text><path d="M 888 606 H 1212" stroke="#cbd8e6"/><text x="888" y="633" font-size="16" font-weight="600" fill="#425b73" >EVIDENCE  ·  provenance + digests</text></g>
<g data-stage="05"><rect x="458" y="452" width="364" height="206" rx="18" fill="#edf3fc" stroke="#cbd8e6"/><rect x="474" y="470" width="44" height="32" rx="9" fill="#3469b7"/><text x="496" y="493" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">05</text><text x="530" y="494" font-size="22" font-weight="700" fill="#17324d" >k3s rollout</text><text x="478" y="535" font-size="19" font-weight="400" fill="#17324d" >Deploy verified image digests.</text><text x="478" y="562" font-size="19" font-weight="400" fill="#17324d" >Preserve runtime settings and</text><text x="478" y="589" font-size="19" font-weight="400" fill="#17324d" >check workload readiness.</text><path d="M 478 606 H 802" stroke="#cbd8e6"/><text x="478" y="633" font-size="16" font-weight="600" fill="#425b73" >EVIDENCE  ·  rollout + preservation</text></g>
<g data-stage="06"><rect x="48" y="452" width="364" height="206" rx="18" fill="#edf8f7" stroke="#cbd8e6"/><rect x="64" y="470" width="44" height="32" rx="9" fill="#167c80"/><text x="86" y="493" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">06</text><text x="120" y="494" font-size="22" font-weight="700" fill="#17324d" >Browser verification</text><text x="68" y="535" font-size="19" font-weight="400" fill="#17324d" >Check served bytes, language</text><text x="68" y="562" font-size="19" font-weight="400" fill="#17324d" >behavior and live connection</text><text x="68" y="589" font-size="19" font-weight="400" fill="#17324d" >separately for each dashboard.</text><path d="M 68 606 H 392" stroke="#cbd8e6"/><text x="68" y="633" font-size="16" font-weight="600" fill="#425b73" >EVIDENCE  ·  bytes + browser checks</text></g>
<rect x="48" y="697" width="1184" height="104" rx="18" fill="#fff4df" stroke="#e9cd94"/><text x="70" y="731" font-size="21" font-weight="700" fill="#17324d" >The source snapshot does not establish release or deployment completion.</text><text x="70" y="764" font-size="18" font-weight="400" fill="#17324d" >Read the run-specific receipts. A successful build or Ready pod alone cannot prove browser delivery.</text><text x="48" y="831" font-size="16" font-weight="400" fill="#425b73" >Documentation snapshot: 6bcfd8d · 15 October 2026 · See process-and-results.md for validation limits.</text></g>
</svg>
