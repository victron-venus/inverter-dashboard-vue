# SonarQube Configuration
# https://sonarsource.github.io/sonar-scanner-msbuild/

sonar.projectKey=victron-venus_inverter-dashboard-vue

# Exclude i18n files from duplication checks
# Translation files (en.ts, de.ts, fr.ts, uk.ts) have identical structure by design
sonar.exclusions=**/i18n/*.ts

# Duplication
sonar.cpd.exclusions=**/i18n/**